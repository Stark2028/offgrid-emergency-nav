name: Core and pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:build
      - run: pnpm audit --audit-level high

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/pipeline/requirements-dev.txt
      - run: python -m pip install -r packages/pipeline/requirements-dev.txt
      - run: python -m pytest packages/pipeline/tests
      - name: Verify Python-generated fixtures match the TypeScript contract
        run: |
          python packages/pipeline/tools/gen_geohash_vectors.py
          python packages/pipeline/tools/gen_tile_fixtures.py
          python packages/pipeline/tools/gen_routing_fixtures.py
          git diff --exit-code -- packages/core/test/fixtures
